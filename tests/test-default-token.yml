name: Test default token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify dist directory exists
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/dist" ]; then
            echo "FAIL: dist directory not found"
            exit 1
          fi
          echo "PASS: dist directory exists"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
      - name: Assert action ran with default token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should run (may fail at API level without real issue context)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with default token (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
