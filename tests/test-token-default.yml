name: Test default github-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run draw-action relying on default token value
        id: action
        # The action.yml declares github-token with default: ${{ github.token }}
        # so omitting the input should use the injected real token automatically.
        # The action will attempt to post a comment on issue #0 (no issue context
        # under workflow_dispatch), which will fail in the un-awaited promise, but
        # the action runner exits 0 because setFailed is only in the outer catch.
        uses: .
        continue-on-error: true

      - name: Assert action step was executed
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step executed with outcome: ${{ steps.action.outcome }}"
