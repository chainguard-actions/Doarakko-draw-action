name: Test basic usage - draw Yu-Gi-Oh card
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run draw-action with default token
        id: action
        # The action fetches a random Yu-Gi-Oh! card and attempts to post it as
        # an issue comment. Under workflow_dispatch there is no issue context
        # (issue number = 0), so the GitHub API call will fail silently inside
        # an un-awaited promise chain. The action runner itself should still
        # exit 0 because setFailed is only called from the outer try/catch.
        uses: .
        with:
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran (step completed)
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          # The action is expected to complete (success or failure is acceptable
          # because under workflow_dispatch there is no issue to comment on).
          # What we verify is that the step was actually executed (not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step executed (outcome: ${{ steps.action.outcome }})"
